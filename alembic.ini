# alembic.ini - Sprint B (B2.2, ADR-008)
#
# Este arquivo NUNCA contem a URL real de conexao. A URL efetiva e resolvida
# em tempo de execucao por migrations/env.py, a partir de
# config.resolver_url_banco() (Config.DATABASE_URL ou Config.TEST_DATABASE_URL,
# conforme a variavel de ambiente NSI_DATABASE_ENV - sem fallback entre as
# duas). O valor abaixo e um placeholder deliberado, nunca usado de fato -
# gravar a URL real aqui violaria a exigencia de nunca commitar credenciais.

[alembic]
script_location = migrations

prepend_sys_path = .

version_path_separator = os

sqlalchemy.url = driver://usuario:senha@localhost/nome_do_banco

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
